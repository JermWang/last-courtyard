name: Test and publish games

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demos/downhill-bike/package-lock.json
      - name: Check the committed GDevelop export
        run: node tools/verify-export.cjs
      - name: Check gameplay
        run: |
          node tests/physics.test.cjs
          node tests/shot.test.cjs
          node tests/animation.test.cjs
          node tests/puzzle.test.cjs
          node tests/elevation.test.cjs
          node tests/journey.test.cjs
          node tests/water.test.cjs
          node tests/grapple-input.test.cjs
      - name: Check the downhill source and export
        run: node demos/downhill-bike/tools/verify-export.cjs
      - name: Install downhill server test dependency
        run: npm ci --prefix demos/downhill-bike --ignore-scripts
      - name: Check downhill gameplay and multiplayer
        run: npm test --prefix demos/downhill-bike
      - name: Assemble both playable games
        run: |
          mkdir -p site/downhill-bike
          cp -R build/. site/
          cp -R demos/downhill-bike/build/. site/downhill-bike/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish browser build
        id: deployment
        uses: actions/deploy-pages@v4
