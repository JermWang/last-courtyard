name: Test and publish courtyard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check the committed GDevelop export
        run: node tools/verify-export.cjs
      - name: Check gameplay
        run: |
          node tests/physics.test.cjs
          node tests/shot.test.cjs
          node tests/animation.test.cjs
          node tests/puzzle.test.cjs
          node tests/elevation.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish browser build
        id: deployment
        uses: actions/deploy-pages@v4
